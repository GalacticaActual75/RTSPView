name: Automatic streaming components
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if upstream versions are unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: streaming-components
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      needed: ${{ steps.select.outputs.needed }}
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select upstream versions
        id: select
        shell: pwsh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python -m venv artifacts/streaming-venv
          $python = 'artifacts/streaming-venv/Scripts/python.exe'
          & $python -m pip install -r integrations/stream-resolver/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $arguments = @('integrations/stream-resolver/update_dependencies.py')
          if ($env:FORCE -eq 'true') { $arguments += '--force' }
          & $python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "NEEDED=$(Test-Path artifacts/streaming-update-needed)" >> $env:GITHUB_ENV
          "needed=$(Test-Path artifacts/streaming-update-needed)" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Build and validate helper
        if: env.NEEDED == 'True'
        shell: pwsh
        run: |
          $python = 'artifacts/streaming-venv/Scripts/python.exe'
          & $python -m unittest discover -s integrations/stream-resolver -p test_resolver.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python integrations/stream-resolver/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python integrations/stream-resolver/check_package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip install -r integrations/stream-resolver/requirements-test.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python tests/stream-playback.checks.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/RTSPView.StreamingUpdateChecks -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Transfer validated helper
        if: env.NEEDED == 'True'
        uses: actions/upload-artifact@v4
        with:
          name: tested-streaming-helper
          path: artifacts/stream-resolver/stream-resolver/
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    if: needs.build.outputs.needed == 'True'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-streaming-helper
          path: artifacts/stream-resolver/stream-resolver/
      - name: Sign and publish tested package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STREAMING_UPDATE_SIGNING_KEY: ${{ secrets.STREAMING_UPDATE_SIGNING_KEY }}
        run: ./tools/Publish-StreamingUpdate.ps1 -Repository $env:GITHUB_REPOSITORY -Commit (git rev-parse HEAD)
